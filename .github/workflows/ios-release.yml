name: iOS Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: 'false'
        type: boolean

env:
  SCHEME: IzmirDatas
  CONFIGURATION: Production
  ARCHIVE_PATH: build/IzmirDatas.xcarchive
  IPA_PATH: build/IzmirDatas.ipa
  EXPORT_OPTIONS_PLIST: ExportOptions.plist

jobs:
  # ================================
  # SwiftLint Job
  # ================================
  swiftlint:
    name: 🧹 SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # ================================
  # Build & Test Job
  # ================================
  build:
    name: 🔨 Build & Test
    runs-on: macos-latest
    needs: swiftlint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Show Available Simulators
        run: xcrun simctl list devices available

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project IzmirDatas.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Development \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Run Tests
        run: |
          xcodebuild test-without-building \
            -project IzmirDatas.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Development \
            CODE_SIGNING_ALLOWED=NO

  # ================================
  # Archive & IPA Job
  # ================================
  archive:
    name: 📦 Archive & Create IPA
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Get Version Info
        id: version
        run: |
          VERSION=$(xcodebuild -project IzmirDatas.xcodeproj -scheme ${{ env.SCHEME }} -showBuildSettings 2>/dev/null | grep "MARKETING_VERSION" | head -1 | sed 's/.*= //')
          BUILD_NUMBER=${{ github.run_number }}
          echo "version=${VERSION:-0.1.0}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "📱 Version: ${VERSION:-0.1.0} (${BUILD_NUMBER})"

      - name: Create Build Directory
        run: mkdir -p build

      - name: Create ExportOptions.plist
        run: |
          cat > ${{ env.EXPORT_OPTIONS_PLIST }} << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Archive App (Unsigned)
        run: |
          xcodebuild archive \
            -project IzmirDatas.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -archivePath ${{ env.ARCHIVE_PATH }} \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Create Unsigned IPA
        run: |
          APP_PATH="${{ github.workspace }}/${{ env.ARCHIVE_PATH }}/Products/Applications"
          IPA_OUTPUT="${{ github.workspace }}/build/IzmirDatas.ipa"
          
          cd "$APP_PATH"
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r "$IPA_OUTPUT" Payload
          rm -rf Payload

      - name: Verify IPA
        run: |
          ls -la build/
          unzip -l build/IzmirDatas.ipa | head -20

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IzmirDatas-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: build/IzmirDatas.ipa
          retention-days: 30

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IzmirDatas-Archive-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 7

  # ================================
  # Release Job
  # ================================
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: archive
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: IzmirDatas-${{ needs.archive.outputs.version }}-${{ needs.archive.outputs.build_number }}
          path: ./artifacts

      - name: List Downloaded Files
        run: ls -la ./artifacts

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ needs.archive.outputs.version }}-build.${{ needs.archive.outputs.build_number }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📌 Release Tag: ${TAG}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "IzmirDatas ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🚌 IzmirDatas ${{ steps.tag.outputs.tag }}
            
            ### 📱 Uygulama Bilgileri
            - **Versiyon:** ${{ needs.archive.outputs.version }}
            - **Build Numarası:** ${{ needs.archive.outputs.build_number }}
            - **Tarih:** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            
            ### 📥 İndirme
            IPA dosyasını indirip AltStore, Sideloadly veya benzeri araçlarla iOS cihazınıza yükleyebilirsiniz.
            
            > ⚠️ **Not:** Bu IPA imzasızdır. Yüklemek için kendi Apple Developer hesabınızla imzalamanız gerekir.
            
            ### 📝 Değişiklikler
            Commit: ${{ github.sha }}
          files: |
            ./artifacts/IzmirDatas.ipa
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
