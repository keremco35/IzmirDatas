name: iOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Build configuration
        required: true
        type: choice
        options:
          - Development
          - Staging
          - Production
        default: Development

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: IzmirDatas.xcodeproj
  SCHEME: IzmirDatas

jobs:
  # ─────────────────────────────────────────────────────────────
  # SwiftLint - Kod kalitesi kontrolü
  # ─────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # ─────────────────────────────────────────────────────────────
  # Build & Test
  # ─────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    needs: lint
    env:
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Development' }}
      RESULT_BUNDLE_PATH: build/TestResults.xcresult
      LOG_DIR: build/logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: |
          mkdir -p "$LOG_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            | tee "$LOG_DIR/resolve.log"

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$LOG_DIR/build.log"

      - name: Run Tests
        run: |
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$LOG_DIR/test.log"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            ${{ env.RESULT_BUNDLE_PATH }}
            ${{ env.LOG_DIR }}
          retention-days: 14

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Sonuçları" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: $BUILD_CONFIGURATION" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheme**: $SCHEME" >> $GITHUB_STEP_SUMMARY
          if [ -d "$RESULT_BUNDLE_PATH" ]; then
            echo "- **Result Bundle**: ✅ Oluşturuldu" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result Bundle**: ❌ Bulunamadı" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────
  # Archive & IPA (sadece main branch push)
  # ─────────────────────────────────────────────────────────────
  archive:
    name: Archive & IPA
    runs-on: macos-latest
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Production' }}
      ARCHIVE_PATH: build/IzmirDatas.xcarchive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        id: ipa
        run: |
          APP_DIR="$ARCHIVE_PATH/Products/Applications"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          
          if [ -z "${APP_PATH:-}" ]; then
            echo "❌ .app bulunamadı: $APP_DIR"
            exit 1
          fi

          APP_NAME="$(basename "$APP_PATH" .app)"
          INFO_PLIST="$APP_PATH/Info.plist"
          
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"

          OUT_DIR="$GITHUB_WORKSPACE/build/ipa"
          mkdir -p "$OUT_DIR"

          STAGING_DIR="$(mktemp -d)"
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/"

          IPA_NAME="${APP_NAME}_${VERSION}_${BUILD_NUMBER}_${TIMESTAMP}.ipa"
          IPA_PATH="$OUT_DIR/$IPA_NAME"
          
          # Create IPA using absolute path
          (cd "$STAGING_DIR" && zip -qr "$IPA_PATH" Payload)

          SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "## 📦 IPA Raporu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Özellik | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Uygulama | $APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Versiyon | $VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $BUILD_NUMBER |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`${SHA256:0:16}...\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.ipa.outputs.version }}-${{ github.run_number }}
          path: build/ipa/*.ipa
          retention-days: 30
