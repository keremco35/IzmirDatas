name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Build configuration
        required: true
        type: choice
        options:
          - Development
          - Staging
          - Production
        default: Development

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PROJECT_PATH: IzmirDatas.xcodeproj
      SCHEME: IzmirDatas
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Development' }}
      ARCHIVE_PATH: build/IzmirDatas.xcarchive
      RESULT_BUNDLE_PATH: build/TestResults.xcresult
      LOG_DIR: build/logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (15+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          xcodebuild -version | tee "$LOG_DIR/xcodebuild-version.log"
          major="$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)"
          if [ "${major:-0}" -lt 15 ]; then
            echo "Xcode 15+ required, found: $(xcodebuild -version | head -n 1)" >&2
            exit 1
          fi

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME" | tee "$LOG_DIR/resolve.log"

      - name: Run unit + UI tests (simulator)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "platform=iOS Simulator,name=Any iOS Simulator Device" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$LOG_DIR/test.log"

      - name: Archive (generic iOS)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$LOG_DIR/archive.log"

      - name: Create IPA from /Products/Applications
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$ARCHIVE_PATH/Products/Applications"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app found under: $APP_DIR" >&2
            exit 1
          fi

          APP_NAME="$(basename "$APP_PATH" .app)"
          INFO_PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "Info.plist not found at: $INFO_PLIST" >&2
            exit 1
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST" || true)"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST" || true)"
          if [ -z "${VERSION:-}" ] || [ -z "${BUILD_NUMBER:-}" ]; then
            echo "Could not read version/build from Info.plist" >&2
            exit 1
          fi

          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"
          OUT_DIR="build/ipa"
          mkdir -p "$OUT_DIR"

          STAGING_DIR="$(mktemp -d)"
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/"

          IPA_NAME="${APP_NAME}_${VERSION}_${BUILD_NUMBER}_${TIMESTAMP}.ipa"
          IPA_PATH="$OUT_DIR/$IPA_NAME"
          (cd "$STAGING_DIR" && zip -qr "$IPA_PATH" Payload)

          SIZE_BYTES="$(stat -f%z "$IPA_PATH")"
          SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          ABS_PATH="$(python3 -c 'import os,sys; print(os.path.abspath(sys.argv[1]))' "$IPA_PATH")"

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "abs_path=$ABS_PATH" >> "$GITHUB_OUTPUT"

          {
            echo "## IPA Raporu"
            echo ""
            echo "- Ortam: $BUILD_CONFIGURATION"
            echo "- Uygulama: $APP_NAME"
            echo "- Versiyon: $VERSION"
            echo "- Build: $BUILD_NUMBER"
            echo "- Zaman (UTC): $TIMESTAMP"
            echo "- Boyut (byte): $SIZE_BYTES"
            echo "- SHA256: $SHA256"
            echo "- Çıktı: $ABS_PATH"
          } | tee "build/ipa_report.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (.ipa + report + xcresult)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.BUILD_CONFIGURATION }}-${{ github.run_number }}
          path: |
            ${{ steps.ipa.outputs.ipa_path }}
            build/ipa_report.txt
            ${{ env.RESULT_BUNDLE_PATH }}
            ${{ env.LOG_DIR }}

      - name: Print error logs (tail)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "---- test.log (tail) ----"
          [ -f "$LOG_DIR/test.log" ] && tail -n 200 "$LOG_DIR/test.log" || true
          echo "---- archive.log (tail) ----"
          [ -f "$LOG_DIR/archive.log" ] && tail -n 200 "$LOG_DIR/archive.log" || true

      - name: Notify on failure (PR comment or issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = context.eventName === 'pull_request'
            const title = `iOS CI başarısız: ${context.workflow} #${context.runNumber}`
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Ref: ${context.ref}`,
              `Ortam: ${process.env.BUILD_CONFIGURATION}`,
              '',
              'Build aşaması başarısız oldu; loglar artifact olarak yüklendiyse Actions ekranından indirilebilir.'
            ].join('\\n')

            if (isPR) {
              const pr = context.payload.pull_request
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `### ${title}\\n\\n${body}`
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              })
            }
